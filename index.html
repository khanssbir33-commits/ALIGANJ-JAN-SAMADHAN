<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aliganj Jan-Samadhan</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f7f4;
  color:#222;
}

.header{
  background:#116530;
  color:white;
  text-align:center;
  padding:25px 15px;
}

.header h1{
  margin:0;
  font-size:26px;
}

.header p{
  margin:8px 0 0;
  font-size:16px;
}

.container{
  max-width:520px;
  margin:auto;
  padding:16px;
}

.card{
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 4px 18px #0002;
}

.pradhan{
  text-align:center;
}

.pradhan img{
  width:190px;
  height:190px;
  object-fit:contain;
  border-radius:50%;
  margin:10px auto;
  display:block;
}

.pradhan h2{
  margin:5px 0;
  color:#116530;
}

.pradhan p{
  margin:5px 0 18px;
  color:#666;
}

label{
  display:block;
  font-weight:bold;
  margin:17px 0 7px;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#116530;
}

textarea{
  height:120px;
  resize:vertical;
}

.photo-box{
  border:2px dashed #bbb;
  border-radius:12px;
  padding:15px;
  text-align:center;
  background:#fafafa;
}

.photo-box input{
  border:0;
  padding:5px;
}

.preview{
  width:100%;
  max-height:250px;
  object-fit:contain;
  margin-top:12px;
  border-radius:10px;
  display:none;
}

.submit-btn{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#116530;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.submit-btn:disabled{
  background:#999;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  display:none;
  font-weight:bold;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.footer{
  text-align:center;
  color:#777;
  font-size:13px;
  padding:20px;
}
</style>
</head>

<body>

<div class="header">
  <h1>ALIGANJ JAN-SAMADHAN</h1>
  <p>ग्राम की समस्या दर्ज करें</p>
</div>

<div class="container">

  <div class="card">

    <div class="pradhan">

      <img src="IMG_0515(3).png" alt="ग्राम प्रधान">

      <h2>ग्राम प्रधान शाकिर ख़ान</h2>

      <p>आपकी समस्या का समाधान करने हेतु शिकायत दर्ज करें</p>

    </div>

    <form id="complaintForm">

      <label for="name">नाम</label>

      <input
        type="text"
        id="name"
        placeholder="अपना नाम लिखें"
        required
      >

      <label for="mobile">मोबाइल नंबर</label>

      <input
        type="tel"
        id="mobile"
        placeholder="10 अंकों का मोबाइल नंबर"
        maxlength="10"
        pattern="[0-9]{10}"
        required
      >

      <label for="category">शिकायत की श्रेणी</label>

      <select id="category" required>

        <option value="">श्रेणी चुनें</option>

        <option value="सड़क">सड़क</option>

        <option value="नाली">नाली</option>

        <option value="सफाई">सफाई</option>

        <option value="पानी">पानी</option>

        <option value="बिजली">बिजली</option>

        <option value="स्ट्रीट लाइट">स्ट्रीट लाइट</option>

        <option value="कूड़ा">कूड़ा</option>

        <option value="सरकारी योजना">सरकारी योजना</option>

        <option value="अन्य">अन्य</option>

      </select>

      <label for="location">मोहल्ला</label>

      <input
        type="text"
        id="location"
        placeholder="अपने मोहल्ले का नाम लिखें"
        required
      >

      <label for="photo">शिकायत की फोटो</label>

      <div class="photo-box">

        <input
          type="file"
          id="photo"
          accept="image/*"
        >

        <img
          id="preview"
          class="preview"
          alt="Photo Preview"
        >

      </div>

      <label for="complaint">शिकायत / समस्या</label>

      <textarea
        id="complaint"
        placeholder="अपनी समस्या विस्तार से लिखें..."
        required
      ></textarea>

      <button
        type="submit"
        class="submit-btn"
        id="submitBtn"
      >
        शिकायत दर्ज करें
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </form>

  </div>

</div>

<div class="footer">
  Aliganj Jan-Samadhan © 2026
</div>


<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwclEzwe8FwrZH3xWNuaanjGdiQQUTQAmac_r9F6OxaCBUEk7s4eLw9pxsn_gN7X-rx/exec";


const form = document.getElementById("complaintForm");

const photoInput = document.getElementById("photo");

const preview = document.getElementById("preview");

const submitBtn = document.getElementById("submitBtn");

const message = document.getElementById("message");


/* PHOTO PREVIEW */

photoInput.addEventListener("change", function(){

  const file = this.files[0];

  if(file){

    const reader = new FileReader();

    reader.onload = function(e){

      preview.src = e.target.result;

      preview.style.display = "block";

    };

    reader.readAsDataURL(file);

  }else{

    preview.style.display = "none";

  }

});


/* FORM SUBMIT */

form.addEventListener("submit", async function(e){

  e.preventDefault();


  submitBtn.disabled = true;

  submitBtn.innerText = "शिकायत भेजी जा रही है...";


  message.style.display = "none";


  const name =
    document.getElementById("name").value.trim();

  const mobile =
    document.getElementById("mobile").value.trim();

  const category =
    document.getElementById("category").value;

  const location =
    document.getElementById("location").value.trim();

  const complaint =
    document.getElementById("complaint").value.trim();


  const photoFile =
    photoInput.files[0];


  let photoBase64 = "";

  let photoName = "";

  let photoType = "";


  /* PHOTO TO BASE64 */

  if(photoFile){

    photoName = photoFile.name;

    photoType = photoFile.type;


    try{

      photoBase64 = await fileToBase64(photoFile);

    }catch(error){

      showMessage(
        "फोटो पढ़ने में समस्या हुई।",
        "error"
      );

      submitBtn.disabled = false;

      submitBtn.innerText = "शिकायत दर्ज करें";

      return;

    }

  }


  /* COMPLAINT DATA */

  const data = {

    name:name,

    mobile:mobile,

    category:category,

    location:location,

    complaint:complaint,

    photo:photoFile ? true : false,

    photoBase64:photoBase64,

    photoName:photoName,

    photoType:photoType

  };


  /* SEND TO GOOGLE APPS SCRIPT */

  try{

    await fetch(

      SCRIPT_URL,

      {

        method:"POST",

        mode:"no-cors",

        headers:{
          "Content-Type":"text/plain;charset=utf-8"
        },

        body:JSON.stringify(data)

      }

    );


    /* LOCAL COMPLAINT ID */

    const complaintId =
      "ALJ-" +
      new Date().getFullYear() +
      "-" +
      Math.random()
      .toString(36)
      .substring(2,8)
      .toUpperCase();


    showMessage(

      "✅ शिकायत सफलतापूर्वक दर्ज हो गई।<br>" +
      "Complaint ID: " +
      complaintId,

      "success"

    );


    form.reset();

    preview.style.display = "none";


  }catch(error){

    showMessage(

      "❌ शिकायत भेजने में समस्या हुई। कृपया दोबारा प्रयास करें।",

      "error"

    );

  }


  submitBtn.disabled = false;

  submitBtn.innerText = "शिकायत दर्ज करें";

});


/* FILE READER */

function fileToBase64(file){

  return new Promise(function(resolve,reject){

    const reader = new FileReader();

    reader.readAsDataURL(file);

    reader.onload = function(){

      const result = reader.result;

      const base64 =
        result.split(",")[1];

      resolve(base64);

    };

    reader.onerror = function(error){

      reject(error);

    };

  });

}


/* MESSAGE */

function showMessage(text,type){

  message.innerHTML = text;

  message.className =
    "message " + type;

  message.style.display = "block";

  window.scrollTo({

    top:document.body.scrollHeight,

    behavior:"smooth"

  });

}

</script>

</body>
</html>
