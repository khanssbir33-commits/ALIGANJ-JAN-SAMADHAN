<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aliganj Jan-Samadhan</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#f3f7f4;color:#222
}
.header{
 background:#116530;color:white;text-align:center;
 padding:25px 15px
}
.header h1{margin:0;font-size:26px}
.header p{margin:8px 0 0}

.container{max-width:520px;margin:auto;padding:16px}

.card{
 background:white;padding:20px;border-radius:18px;
 box-shadow:0 4px 18px #0002
}

.pradhan{
 text-align:center
}

.pradhan img{
 width:190px;height:190px;
 object-fit:contain;
 border-radius:50%;
 margin:10px auto;
 display:block
}

.pradhan h2{
 margin:5px 0;color:#116530
}

label{
 display:block;font-weight:bold;
 margin:17px 0 7px
}

input,select,textarea{
 width:100%;padding:13px;
 border:1px solid #ccc;border-radius:10px;
 font-size:16px
}

textarea{height:120px}

.location{
 display:flex;gap:8px
}

.location input{flex:1}

.location button{
 border:0;background:#2563eb;
 color:white;border-radius:10px;
 padding:0 12px
}

.submit{
 width:100%;padding:15px;margin-top:22px;
 border:0;border-radius:11px;
 background:#15803d;color:white;
 font-size:18px;font-weight:bold
}

.success{
 display:none;background:#dcfce7;
 color:#166534;padding:18px;
 margin-top:18px;border-radius:12px;
 text-align:center
}

#formPage{display:none}

.photo-preview{
 width:100%;max-height:220px;
 object-fit:contain;margin-top:10px;
 display:none;border-radius:10px
}
</style>
</head>

<body>

<!-- WELCOME PAGE -->
<div id="welcomePage">
<div class="header">
<h1>🏡 ALIGANJ JAN-SAMADHAN</h1>
<p>गाँव की समस्या, हमारा समाधान</p>
</div>

<div class="container">
<div class="card pradhan">

<img src="IMG_0515(3).png" alt="ग्राम प्रधान">

<h2>ग्राम प्रधान</h2>
<h2>शाकिर ख़ान</h2>

<p>
आपकी समस्या हमारी प्राथमिकता है।<br>
कृपया अपनी समस्या दर्ज करें।
</p>

<button class="submit" onclick="openForm()">
📝 शिकायत दर्ज करें
</button>

</div>
</div>
</div>


<!-- COMPLAINT FORM -->
<div id="formPage">

<div class="header">
<h1>📝 शिकायत दर्ज करें</h1>
<p>Aliganj Jan-Samadhan</p>
</div>

<div class="container">
<div class="card">

<form id="complaintForm">

<label>👤 आपका नाम</label>
<input id="name" required placeholder="अपना पूरा नाम">

<label>📞 मोबाइल नंबर</label>
<input id="mobile" type="tel"
maxlength="10"
required placeholder="10 अंकों का मोबाइल नंबर">

<label>🗂️ समस्या की श्रेणी</label>
<select id="category" required>
<option value="">श्रेणी चुनें</option>
<option>सफाई</option>
<option>नाली</option>
<option>सड़क</option>
<option>पानी</option>
<option>स्ट्रीट लाइट</option>
<option>कूड़ा</option>
<option>अन्य</option>
</select>

<label>📍 समस्या की जगह</label>

<div class="location">
<input id="location" readonly
placeholder="Location लेने के लिए button दबाएँ">

<button type="button" onclick="getLocation()">
📍 Location
</button>
</div>

<label>📸 समस्या की फोटो</label>

<input id="photo"
type="file"
accept="image/*"
capture="environment">

<img id="preview" class="photo-preview">

<label>📝 शिकायत / Note</label>

<textarea id="complaint"
required
placeholder="अपनी समस्या पूरी तरह लिखें..."></textarea>

<button class="submit" id="submitBtn">
🟢 शिकायत Submit करें
</button>

</form>

<div class="success" id="success">
<h2>✅ शिकायत दर्ज हो गई!</h2>
<p>आपकी Complaint ID:</p>
<h2 id="complaintId"></h2>
<p>कृपया इस ID को संभालकर रखें।</p>
</div>

</div>
</div>
</div>


<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwclEzwe8FwrZH3xWNuaanjGdiQQUTQAmac_r9F6OxaCBUEk7s4eLw9pxsn_gN7X-rx/exec";


function openForm(){
 document.getElementById("welcomePage").style.display="none";
 document.getElementById("formPage").style.display="block";
}


function getLocation(){

 if(!navigator.geolocation){
   alert("इस फोन में Location उपलब्ध नहीं है।");
   return;
 }

 navigator.geolocation.getCurrentPosition(
 function(position){

   const lat=position.coords.latitude;
   const lon=position.coords.longitude;

   document.getElementById("location").value =
   lat.toFixed(6)+", "+lon.toFixed(6);
 },
 function(){
   alert("Location की permission Allow करें।");
 }
 );
}


document.getElementById("photo").addEventListener("change",function(){

 const file=this.files[0];

 if(!file)return;

 const preview=document.getElementById("preview");

 preview.src=URL.createObjectURL(file);
 preview.style.display="block";
});


document.getElementById("complaintForm")
.addEventListener("submit",async function(e){

 e.preventDefault();

 const name=document.getElementById("name").value.trim();
 const mobile=document.getElementById("mobile").value.trim();
 const category=document.getElementById("category").value;
 const location=document.getElementById("location").value;
 const complaint=document.getElementById("complaint").value.trim();
 const photo=document.getElementById("photo").files[0];

 if(!/^[0-9]{10}$/.test(mobile)){
   alert("सही 10 अंकों का मोबाइल नंबर डालें।");
   return;
 }

 if(!location){
   alert("पहले Location शेयर करें।");
   return;
 }

 const btn=document.getElementById("submitBtn");

 btn.disabled=true;
 btn.innerText="⏳ शिकायत भेजी जा रही है...";

 let photoBase64="";
 let photoType="";
 let photoName="";

 if(photo){

   if(photo.size > 5*1024*1024){
     alert("Photo 5 MB से छोटी रखें।");
     btn.disabled=false;
     btn.innerText="🟢 शिकायत Submit करें";
     return;
   }

   photoBase64=await fileToBase64(photo);
   photoType=photo.type;
   photoName=photo.name;
 }

 const data={
   name:name,
   mobile:mobile,
   category:category,
   location:location,
   complaint:complaint,
   photo:photo ? true : false,
   photoBase64:photoBase64,
   photoType:photoType,
   photoName:photoName
 };

 try{

   await fetch(SCRIPT_URL,{
     method:"POST",
     mode:"no-cors",
     headers:{
       "Content-Type":"text/plain;charset=utf-8"
     },
     body:JSON.stringify(data)
   });

   const id="ALJ-"+new Date().getFullYear()+"-"+Math.floor(1000+Math.random()*9000);

   document.getElementById("complaintId").innerText=id;

   document.getElementById("success").style.display="block";

   document.getElementById("complaintForm").reset();

   document.getElementById("preview").style.display="none";

   btn.disabled=false;
   btn.innerText="🟢 शिकायत Submit करें";

 }catch(error){

   alert("Complaint भेजने में समस्या हुई। दोबारा कोशिश करें।");

   btn.disabled=false;
   btn.innerText="🟢 शिकायत Submit करें";
 }

});


function fileToBase64(file){

 return new Promise((resolve,reject)=>{

   const reader=new FileReader();

   reader.onload=()=>{
     resolve(reader.result.split(",")[1]);
   };

   reader.onerror=reject;

   reader.readAsDataURL(file);
 });
}

</script>

</body>
</html>
